name: Sign Orvia IPA

on:
  workflow_dispatch:
    inputs:
      p12_base64:
        description: 'P12 certificate base64'
        required: true
        type: string
      profile_base64:
        description: 'Mobileprovision base64'
        required: true
        type: string
      p12_password:
        description: 'P12 password'
        required: true
        type: string

jobs:
  sign:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare signing files
        env:
          P12_BASE64: ${{ inputs.p12_base64 }}
          PROFILE_BASE64: ${{ inputs.profile_base64 }}
        run: |
          echo "$P12_BASE64" | base64 -d > cert.p12
          echo "$PROFILE_BASE64" | base64 -d > profile.mobileprovision

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config libssl-dev git

      - name: Build zsign
        run: |
          git clone --depth 1 https://github.com/zhlynn/zsign.git zsign-src
          cd zsign-src/build/linux
          make clean && make
          cp ../../bin/zsign ../../../zsign-bin
          cd ../../..
          chmod +x zsign-bin

      - name: Sign IPA
        env:
          P12_PASSWORD: ${{ inputs.p12_password }}
        run: |
          ./zsign-bin \
            -k cert.p12 \
            -p "$P12_PASSWORD" \
            -m profile.mobileprovision \
            -b com.ice.orvia \
            -o Orvia-signed.ipa \
            Orvia.ipa

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: Orvia-signed
          path: Orvia-signed.ipa
          retention-days: 1

      - name: Cleanup
        if: always()
        run: |
          rm -f cert.p12 profile.mobileprovision
