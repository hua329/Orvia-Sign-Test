name: Sign Orvia IPA

on:
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare signing files
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          PROFILE_BASE64: ${{ secrets.PROFILE_BASE64 }}
        run: |
          echo "$P12_BASE64" | base64 -d > cert.p12
          echo "$PROFILE_BASE64" | base64 -d > profile.mobileprovision

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential git

      - name: Build zsign
        run: |
          git clone --depth 1 https://github.com/zhlynn/zsign.git
          cd zsign
          rm -rf build
          mkdir build
          cd build
          cmake ..
          make -j2
          cp zsign ../../zsign
          cd ../..
          chmod +x zsign

      - name: Sign IPA
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          ./zsign \
            -k cert.p12 \
            -p "$P12_PASSWORD" \
            -m profile.mobileprovision \
            -b com.ice.orvia \
            -o Orvia-signed.ipa \
            Orvia.ipa

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: Orvia-signed
          path: Orvia-signed.ipa
          retention-days: 1

      - name: Cleanup
        if: always()
        run: |
          rm -f cert.p12 profile.mobileprovision
